
name: Samantha - TheTowerSDK Runtime Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-runtime-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Samantha repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install exact TheTowerSDK version
        run: |
          TEST_DIR="$RUNNER_TEMP/sdk-runtime-test"

          mkdir -p "$TEST_DIR"

          npm install --prefix "$TEST_DIR" \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            thetowersdk@0.14.1

          echo "SDK_PACKAGE_DIR=$TEST_DIR/node_modules/thetowersdk" >> "$GITHUB_ENV"

      - name: Verify installed SDK version
        run: |
          node -e "
            const p = require(process.env.SDK_PACKAGE_DIR + '/package.json');
            console.log('Package:', p.name);
            console.log('Version:', p.version);
            if (p.name !== 'thetowersdk' || p.version !== '0.14.1') {
              process.exit(1);
            }
          "

      - name: Check smoke test script syntax
        run: |
          node --check TheTowerData/scripts/test-sdk-runtime-v2.mjs

      - name: Run SDK runtime smoke test
        run: |
          node TheTowerData/scripts/test-sdk-runtime-v2.mjs \
            "$SDK_PACKAGE_DIR" \
            "$GITHUB_WORKSPACE/sdk-runtime-smoke-report.json"

      - name: Upload SDK smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TheTowerSDK-runtime-smoke-test-0.14.1
          path: sdk-runtime-smoke-report.json
          if-no-files-found: warn
          retention-days: 90
