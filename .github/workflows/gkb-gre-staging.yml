name: Samantha - GKB GRE Staging Adapter

on:
  pull_request:
    branches:
      - GKB
    paths:
      - 'GKB/adapter/gre-staging.mjs'
      - 'GKB/schema/gre-staging.schema.json'
      - 'GKB/tests/gre-staging.test.mjs'
      - 'GKB/staging/gre-source-snapshot/**'
      - 'GKB/runtime/package.json'
      - 'GKB/runtime/package-lock.json'
      - '.github/workflows/gkb-gre-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gre-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: GKB/runtime/package-lock.json
      - name: Install pinned GKB runtime dependencies
        working-directory: GKB/runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run GRE staging adapter tests
        working-directory: GKB/runtime
        run: |
          npm run test:gre-staging
          npm run test:gre-reviewed-claim
      - name: Generate GRE staging preview
        working-directory: GKB/runtime
        run: npm run stage:gre-evidence -- ../staging/gre-source-snapshot/TestAccount-62ae508f ../staging/gre-import 2026-11-27
      - name: Upload GRE staging outputs
        uses: actions/upload-artifact@v4
        with:
          name: samantha-gre-staging-${{ github.run_id }}
          path: |
            GKB/staging/gre-import/gre-staging.json
            GKB/staging/gre-import/gre-review-queue.json
            GKB/staging/gre-import/gre-import-report.json
          if-no-files-found: error
          retention-days: 30
