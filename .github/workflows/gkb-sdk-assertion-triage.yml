name: Samantha - GKB SDK Assertion Auto Triage

on:
  workflow_dispatch:
  push:
    branches:
      - GKB
    paths:
      - 'GKB/adapter/sdk-assertion-staging.mjs'
      - 'GKB/adapter/sdk-assertion-triage.mjs'
      - 'GKB/tests/sdk-assertion-triage.test.mjs'
      - 'GKB/runtime/package.json'
      - 'GKB/runtime/package-lock.json'
      - '.github/workflows/gkb-sdk-assertion-triage.yml'

permissions:
  contents: read

jobs:
  sdk-assertion-triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout GKB branch
        uses: actions/checkout@v5
        with:
          ref: GKB
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: GKB/runtime/package-lock.json
      - name: Install pinned SDK runtime
        working-directory: GKB/runtime
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run staging and triage tests
        working-directory: GKB/runtime
        run: |
          npm run test:sdk-assertion-staging
          npm run test:sdk-assertion-triage
      - name: Generate SDK assertion staging
        working-directory: GKB/runtime
        run: npm run stage:sdk-assertions
      - name: Generate automatic triage and exception queue
        working-directory: GKB/runtime
        run: node ../adapter/sdk-assertion-triage.mjs
      - name: Upload triage reports
        uses: actions/upload-artifact@v4
        with:
          name: samantha-sdk-assertion-triage-${{ github.run_id }}
          path: |
            GKB/staging/sdk-assertions.json
            GKB/staging/sdk-assertion-triage.json
            GKB/staging/sdk-assertion-manual-review-queue.json
          if-no-files-found: error
          retention-days: 30
