name: Samantha - Preserve TheTowerSDK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Samantha repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify Node and Git
        run: |
          node --version
          git --version

      - name: Check preservation script syntax
        run: |
          node --check TheTowerData/scripts/preserve-upstream-v3.mjs

      - name: Run SDK preservation
        run: |
          node TheTowerData/scripts/preserve-upstream-v3.mjs

      - name: Upload preservation output
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TheTowerSDK-preservation-0.14.1
          path: TheTowerData/staging/thetowersdk/0.14.1/
          if-no-files-found: error
          retention-days: 90
