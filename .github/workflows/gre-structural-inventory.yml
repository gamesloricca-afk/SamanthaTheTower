name: Samantha - GRE Structural Metadata Inventory

on:
  workflow_dispatch:
  push:
    branches:
      - gre-gkb-integration-design
  pull_request:
    branches:
      - GKB
    paths:
      - 'GKB/adapter/gre-structural-inventory.mjs'
      - 'GKB/adapter/gre-structural-lookup.mjs'
      - 'GKB/adapter/gre-metadata-explorer.mjs'
      - 'GKB/tests/gre-structural-inventory.test.mjs'
      - 'GKB/tests/gre-structural-lookup.test.mjs'
      - 'GKB/tests/gre-metadata-explorer.test.mjs'
      - '.github/workflows/gre-structural-inventory.yml'

permissions:
  contents: read

jobs:
  gre-structural-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v5
      - name: Checkout pinned GRE source snapshot
        uses: actions/checkout@v5
        with:
          repository: gamesloricca-afk/SamanthaTheTower
          ref: 62ae508f3473231b81d27903bdf63e899bb739be
          path: source-gre
          persist-credentials: false
      - name: Verify source commit
        working-directory: source-gre
        run: |
          test "$(git rev-parse HEAD)" = "62ae508f3473231b81d27903bdf63e899bb739be"
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Run structural inventory tests
        run: node GKB/tests/gre-structural-inventory.test.mjs
      - name: Generate complete GRE structural inventory
        run: node GKB/adapter/gre-structural-inventory.mjs source-gre "$RUNNER_TEMP/gre-structural-inventory"
      - name: Test structural lookup and claim references
        run: node GKB/tests/gre-structural-lookup.test.mjs
      - name: Test GRE metadata explorer
        run: node GKB/tests/gre-metadata-explorer.test.mjs
      - name: Build searchable method index and claim references
        run: node GKB/adapter/gre-structural-lookup.mjs build "$RUNNER_TEMP/gre-structural-inventory" GKB/staging/gre-source-snapshot/TestAccount-62ae508f
      - name: Upload inventory, search index, references, and reports
        uses: actions/upload-artifact@v4
        with:
          name: samantha-gre-structural-inventory-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gre-structural-inventory/gre-types.jsonl
            ${{ runner.temp }}/gre-structural-inventory/gre-methods.jsonl
            ${{ runner.temp }}/gre-structural-inventory/gre-domain-memberships.jsonl
            ${{ runner.temp }}/gre-structural-inventory/gre-structural-inventory-report.json
            ${{ runner.temp }}/gre-structural-inventory/gre-method-search-index.jsonl
            ${{ runner.temp }}/gre-structural-inventory/gre-claim-method-links.jsonl
            ${{ runner.temp }}/gre-structural-inventory/gre-structural-lookup-report.json
          if-no-files-found: error
          retention-days: 30
