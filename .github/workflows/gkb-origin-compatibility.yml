name: Samantha - GKB Origin and SDK Compatibility Tests

on:
  workflow_dispatch:
  push:
    branches:
      - GKB

permissions:
  contents: read

jobs:
  gkb-origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout GKB branch
        uses: actions/checkout@v5
        with:
          ref: GKB

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Verify Node.js
        run: node --version

      - name: Install pinned GKB runtime dependencies
        working-directory: GKB/runtime
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify pinned runtime dependencies
        working-directory: GKB/runtime
        run: |
          npm ls thetowersdk ajv --depth=0

      - name: Test SDK import manifest and drift detector
        working-directory: GKB/runtime
        run: npm run test:sdk-import-manifest

      - name: Generate SDK import manifest candidate
        working-directory: GKB/runtime
        run: npm run report:sdk-import-manifest

      - name: Inspect pinned SDK public entry points
        working-directory: GKB/runtime
        run: npm run test:sdk-public-exports

      - name: Inspect pinned SDK knowledge graph structure
        working-directory: GKB/runtime
        run: npm run inspect:sdk-knowledge-shape

      - name: Inspect pinned SDK data catalogs
        working-directory: GKB/runtime
        run: npm run inspect:sdk-data-catalogs

      - name: Smoke test documented SDK mechanics functions
        working-directory: GKB/runtime
        run: npm run test:sdk-mechanics-api

      - name: Compare Samantha unique module catalog with pinned SDK
        working-directory: GKB/runtime
        run: npm run compare:sdk-unique-modules

      - name: Test conservative SDK identifier mapping
        working-directory: GKB/runtime
        run: npm run test:sdk-identifier-mapping

      - name: Generate SDK identifier mapping report
        working-directory: GKB/runtime
        run: npm run report:sdk-identifier-mapping

      - name: Test raw SDK domain catalog staging
        working-directory: GKB/runtime
        run: npm run test:sdk-domain-catalog-staging

      - name: Stage Research, Workshop, Cards/Masteries, and Perks catalogs
        working-directory: GKB/runtime
        run: npm run stage:sdk-domain-catalogs

      - name: Test SDK domain catalog structural audit
        working-directory: GKB/runtime
        run: npm run test:sdk-domain-catalog-audit

      - name: Test nested SDK catalog structure and value observations
        working-directory: GKB/runtime
        run: npm run test:sdk-domain-catalog-nested-audit

      - name: Generate SDK domain catalog structural audit
        working-directory: GKB/runtime
        run: npm run report:sdk-domain-catalog-audit

      - name: Test SDK-to-SDK data catalog crosswalk
        working-directory: GKB/runtime
        run: npm run test:sdk-data-catalog-crosswalk

      - name: Generate SDK-to-SDK data catalog crosswalk
        working-directory: GKB/runtime
        run: npm run report:sdk-data-catalog-crosswalk

      - name: Inspect SDK wiki, contributions, and charts
        working-directory: GKB/runtime
        run: npm run inspect:sdk-wiki-contributions-charts

      - name: Validate canonical GKB claim schema
        working-directory: GKB/runtime
        run: npm run test:claim-schema

      - name: Validate unique module catalog against its domain schema
        working-directory: GKB/runtime
        run: npm run test:unique-modules

      - name: Validate Samantha origin registry
        working-directory: GKB/runtime
        run: npm run test:origin-registry

      - name: Test SDK claim staging adapter
        working-directory: GKB/runtime
        run: npm run test:sdk-claim-staging

      - name: Generate SDK claim staging report
        working-directory: GKB/runtime
        run: node ../adapter/sdk-claim-staging.mjs

      - name: Test SDK assertion staging adapter
        working-directory: GKB/runtime
        run: npm run test:sdk-assertion-staging

      - name: Test review-gated canonical claim normalizer
        working-directory: GKB/runtime
        run: npm run test:reviewed-assertion-normalizer

      - name: Generate SDK assertion staging report
        working-directory: GKB/runtime
        run: npm run stage:sdk-assertions

      - name: Test SDK edge staging adapter
        working-directory: GKB/runtime
        run: npm run test:sdk-edge-staging

      - name: Generate SDK edge staging report
        working-directory: GKB/runtime
        run: npm run stage:sdk-edges

      - name: Test SDK contradiction staging adapter
        working-directory: GKB/runtime
        run: npm run test:sdk-contradiction-staging

      - name: Generate SDK contradiction staging report
        working-directory: GKB/runtime
        run: npm run stage:sdk-contradictions

      - name: Validate combined SDK staging integrity
        working-directory: GKB/runtime
        run: npm run report:sdk-staging-integrity

      - name: Upload SDK staging review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gkb-sdk-staging-${{ github.run_number }}
          path: |
            GKB/staging/sdk-import-manifest.json
            GKB/reports/sdk-import-drift-report.json
            GKB/staging/sdk-claims.json
            GKB/staging/sdk-assertions.json
            GKB/staging/sdk-edges.json
            GKB/staging/sdk-contradictions.json
            GKB/reports/sdk-staging-integrity-report.json
            GKB/reports/sdk-identifier-mapping-report.json
            GKB/staging/sdk-domain-catalogs.json
            GKB/reports/sdk-data-catalog-crosswalk.json
            GKB/reports/sdk-domain-catalog-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Run SDK origin compatibility self-test
        run: node GKB/adapter/origin-compatibility.mjs

      - name: Run TypeScript origin declaration parser tests
        run: node GKB/adapter/typescript-origin-parser.mjs

      - name: Run source origin mapping self-test
        run: node GKB/adapter/origin-mapping.mjs

      - name: Run origin JSON Schema integration test
        working-directory: GKB/runtime
        run: npm run test:origin-schema

      - name: Inspect SDK JSON Schema dialect (known origin mismatch is reported separately)
        working-directory: GKB/runtime
        run: node ../adapter/inspect-sdk-schema-dialect.mjs

      - name: Run SDK JSON export smoke test
        working-directory: GKB/runtime
        run: npm run test:sdk-json-exports

      - name: Validate actual SDK knowledge graph and record origin evidence
        working-directory: GKB/runtime
        run: node ../adapter/validate-sdk-knowledge-graph.mjs
