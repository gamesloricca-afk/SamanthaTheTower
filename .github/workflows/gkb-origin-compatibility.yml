name: Samantha - GKB Origin Compatibility Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  origin-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout GKB branch
        uses: actions/checkout@v5
        with:
          ref: GKB

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Verify Node.js
        run: node --version

      - name: Run origin compatibility self-test
        run: node GKB/adapter/origin-compatibility.mjs
