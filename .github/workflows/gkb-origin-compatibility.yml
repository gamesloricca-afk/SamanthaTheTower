name: Samantha - GKB SDK Runtime Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout GKB branch
        uses: actions/checkout@v5
        with:
          ref: GKB

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Verify Node.js
        run: node --version

      - name: Run origin compatibility self-test
        run: node GKB/adapter/origin-compatibility.mjs

      - name: Install TheTowerSDK runtime dependency
        working-directory: GKB/runtime
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify installed TheTowerSDK version
        working-directory: GKB/runtime
        run: npm ls thetowersdk --depth=0

      - name: Run SDK JSON export smoke test
        working-directory: GKB/runtime
        run: npm run test:sdk-json-exports
