```yaml
name: Samantha - TheTowerSDK JSON Export Compatibility Test

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-runtime-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Samantha repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify Node and npm
        run: |
          node --version
          npm --version

      - name: Install exact TheTowerSDK version
        run: |
          TEST_DIR="$RUNNER_TEMP/sdk-runtime-test"
          mkdir -p "$TEST_DIR"

          npm install --prefix "$TEST_DIR" \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            thetowersdk@0.14.1

          echo "SDK_PACKAGE_DIR=$TEST_DIR/node_modules/thetowersdk" >> "$GITHUB_ENV"

      - name: Verify installed SDK version
        run: |
          node -e "
            const p = require(process.env.SDK_PACKAGE_DIR + '/package.json');
            console.log('Package:', p.name);
            console.log('Version:', p.version);

            if (p.name !== 'thetowersdk' || p.version !== '0.14.1') {
              process.exit(1);
            }
          "

      - name: Check JSON export test script syntax
        run: |
          node --check TheTowerData/scripts/test-sdk-runtime-v3.mjs

      - name: Run JSON export compatibility test
        run: |
          node TheTowerData/scripts/test-sdk-runtime-v3.mjs \
            "$SDK_PACKAGE_DIR" \
            "$GITHUB_WORKSPACE/sdk-json-export-report.json"

      - name: Upload SDK JSON export report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TheTowerSDK-json-export-test-0.14.1
          path: sdk-json-export-report.json
          if-no-files-found: warn
          retention-days: 90
```
